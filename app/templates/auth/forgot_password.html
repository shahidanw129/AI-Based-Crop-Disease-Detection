{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-layout"><div class="auth-aside"><p class="eyebrow">Account access</p><h1>Find your<br><em>way back.</em></h1><p>Reset links expire after 30 minutes.</p></div><div class="auth-panel"><p class="eyebrow eyebrow-green">Fieldnote account</p><h2>Forgot password</h2><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" autocomplete="email" maxlength="255" required></label><button class="button button-dark" type="submit">Send reset link <span aria-hidden="true">↗</span></button></form><p class="form-foot"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></div></section>
{% endblock %}
