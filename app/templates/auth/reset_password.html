{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="auth-layout"><div class="auth-aside"><p class="eyebrow">Account access</p><h1>A fresh<br><em>start.</em></h1><p>Choose a new password for your Fieldnote account.</p></div><div class="auth-panel"><p class="eyebrow eyebrow-green">Fieldnote account</p><h2>New password</h2><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Password <span class="label-note">10 characters minimum</span><input type="password" name="password" autocomplete="new-password" minlength="10" required></label><button class="button button-dark" type="submit">Update password <span aria-hidden="true">↗</span></button></form></div></section>
{% endblock %}
