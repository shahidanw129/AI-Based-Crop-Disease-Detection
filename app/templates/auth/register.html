{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-layout"><div class="auth-aside"><p class="eyebrow">A better field record starts here</p><h1>Make room<br>for <em>noticing.</em></h1><p>One account for scans, weather notes, and useful crop references.</p></div><div class="auth-panel"><p class="eyebrow eyebrow-green">Fieldnote account</p><h2>Create account</h2><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input type="text" name="name" autocomplete="name" minlength="2" maxlength="100" required></label><label>Email address<input type="email" name="email" autocomplete="email" maxlength="255" required></label><label>Password <span class="label-note">10 characters minimum</span><input type="password" name="password" autocomplete="new-password" minlength="10" required></label><button class="button button-dark" type="submit">Create account <span aria-hidden="true">↗</span></button></form><p class="form-foot">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></section>
{% endblock %}
